# License:  Apache-2.0
# -----------------------------------------------------------------------------

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # O nome do job precisa ser "ci": é o check exigido pela proteção da main.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Antes do M0 ser mergeado a main não tem projeto Python; o job passa
      # sem executar nada, em vez de travar PRs que só mexem em docs/arquivos.
      - name: Detectar projeto Python
        id: project
        run: |
          if [ -f pyproject.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - name: Instalar dependências
        if: steps.project.outputs.found == 'true'
        run: uv sync --frozen

      - name: Lint (ruff)
        if: steps.project.outputs.found == 'true'
        run: uv run ruff check .

      - name: Formatação (ruff format)
        if: steps.project.outputs.found == 'true'
        run: uv run ruff format --check .

      - name: Tipos (pyright)
        if: steps.project.outputs.found == 'true'
        run: uv run pyright

      # --cov ativa o gate fail_under de [tool.coverage.report] no pyproject.
      - name: Testes e cobertura (pytest)
        if: steps.project.outputs.found == 'true'
        run: uv run pytest --cov
