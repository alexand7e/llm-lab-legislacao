[project]
name = "llm-lab-legislacao"
version = "0.1.0"
description = "Incremental lab of LLM techniques applied to Brazilian digital and consumer law."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx2>=2.13",
    "lxml>=5.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
lab = "lab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["api: calls real provider APIs; run manually with `pytest -m api`"]
addopts = "-m 'not api'"

# Gate de cobertura (SPEC 8.5): aplicado quando o pytest roda com --cov,
# como no CI; `pytest -m api` sem --cov não é afetado.
[tool.coverage.run]
source = ["lab"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
